# Desenvolvimento com recarga automática, só com Docker:
#
#   docker compose -f docker-compose.dev.yml up
#
# Front em http://localhost:5173 · API em http://localhost:3000/api · página de teste do agente em http://localhost:8090
# Salvou um arquivo, a tela atualiza sozinha.
#
# Rodar testes e conferir tipos pelo mesmo container:
#   docker compose -f docker-compose.dev.yml run --rm dev npm test
#   docker compose -f docker-compose.dev.yml run --rm dev npm run typecheck
services:
  # O agente da aba Ask (apps/agent). Mudou o código ou os cartões dele: `docker compose -f docker-compose.dev.yml up --build agent`.
  agent:
    build:
      context: apps/agent
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "${AGENT_PORT:-8090}:8080"

  dev:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm install && npm run dev"
    environment:
      AGENT_URL: ${AGENT_URL:-http://agent:8080/api/ask}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      PLACES_ONLINE: ${PLACES_ONLINE:-1}
      PASSES_ONLINE: ${PASSES_ONLINE:-1}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
      VITE_POLL: "1"
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
    ports:
      - "5173:5173"
      - "3000:3000"

volumes:
  node_modules:
