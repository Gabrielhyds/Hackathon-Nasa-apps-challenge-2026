# nginx do contêiner único (deploy/space/Dockerfile). Roda sem root: tudo o que ele escreve fica em /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # mesma compressão e mesmo cache de apps/web/nginx.conf: mudou lá, mude aqui
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  server {
    listen 7860;
    root /repo/apps/web/dist;
    index index.html;

    location /api/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
      # respostas do agente chegam em pedaços (SSE): sem buffer e com espera longa
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location /tiles/ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
