server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Texto vai comprimido: o JavaScript e o CSS da página caem para menos de um terço. Imagens (JPG, PNG, os pacotes
  # .bin do globo) e fontes (woff2) já são comprimidas e ficam de fora. A resposta do agente em pedaços
  # (text/event-stream) não está na lista, então segue sem compressão e sem espera.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # respostas do agente chegam em pedaços (SSE): sem buffer e com espera longa
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Arquivos com hash no nome (o build do Vite): o conteúdo nunca muda, então o navegador guarda por um ano e nem
  # pergunta de novo. Publicação nova troca o nome do arquivo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Pacotes de imagem do globo: o nome não muda quando são gerados de novo, então o navegador confere a cada visita
  # (a resposta "não mudou" é pequena) em vez de baixar os 11 MB outra vez.
  location /tiles/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # A página em si nunca fica guardada sem conferir: é ela que aponta para os arquivos novos depois de uma publicação.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
